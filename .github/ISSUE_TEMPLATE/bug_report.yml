name: Bug or incorrect behavior
description: Report a reproducible problem in the firmware, hardware or documentation.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include steps, logs or measurements. State if this was observed on hardware or in a simulator. Remove secrets and personal information.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Version and setup
      description: Release or commit, board revision, sensors and relevant test conditions. For gas readings, include the reference source and how the comparison was made, if available.
    validations:
      required: true
