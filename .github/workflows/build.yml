name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ESP32-P4 Firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/firmware

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake pkg-config libsdl2-dev

      - name: Run host unit and static tests
        run: ./scripts/run_tests.sh

      - name: Build pre-v3 ESP32-P4 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: software/firmware
          command: >-
            idf.py -B build/esp32p4-pre3
            -D IDF_TARGET=esp32p4
            -D SDKCONFIG=build/esp32p4-pre3/sdkconfig
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32p4;sdkconfig.defaults.esp32p4.pre3"
            build

      - name: Run full simulator tests
        env:
          TRIMIX_REQUIRE_SIMULATOR: "1"
        run: ./scripts/run_tests.sh

      - name: Check pre-v3 firmware size
        env:
          BUILD_DIR: ${{ github.workspace }}/software/firmware/build/esp32p4-pre3
          PARTITIONS_FILE: ${{ github.workspace }}/software/firmware/partitions.esp32p4.pre3.csv
        run: ./scripts/check_firmware_size.sh

      - name: Build v3+ ESP32-P4 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: software/firmware
          command: >-
            idf.py -B build/esp32p4-v3
            -D IDF_TARGET=esp32p4
            -D SDKCONFIG=build/esp32p4-v3/sdkconfig
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32p4;sdkconfig.defaults.esp32p4.v3"
            build

      - name: Check v3+ firmware size
        env:
          BUILD_DIR: ${{ github.workspace }}/software/firmware/build/esp32p4-v3
        run: ./scripts/check_firmware_size.sh

      - name: Create pre-v3 factory image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: software/firmware
          command: >-
            esptool.py --chip esp32p4 merge_bin
            --flash_mode dio --flash_freq 80m --flash_size 16MB
            -o Trimix_analyzer_esp32p4_pre3_factory_${{ github.sha }}.bin
            0x2000 build/esp32p4-pre3/bootloader/bootloader.bin
            0x20000 build/esp32p4-pre3/Trimix_analyzer.bin
            0x8000 build/esp32p4-pre3/partition_table/partition-table.bin
            0x10000 build/esp32p4-pre3/ota_data_initial.bin

      - name: Create v3+ factory image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: software/firmware
          command: >-
            esptool.py --chip esp32p4 merge_bin
            --flash_mode dio --flash_freq 80m --flash_size 32MB
            -o Trimix_analyzer_esp32p4_v3_factory_${{ github.sha }}.bin
            0x2000 build/esp32p4-v3/bootloader/bootloader.bin
            0x20000 build/esp32p4-v3/Trimix_analyzer.bin
            0x8000 build/esp32p4-v3/partition_table/partition-table.bin
            0x10000 build/esp32p4-v3/ota_data_initial.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ziphius-esp32p4-${{ github.sha }}
          if-no-files-found: error
          path: |
            software/firmware/build/esp32p4-pre3/Trimix_analyzer.bin
            software/firmware/build/esp32p4-pre3/Trimix_analyzer.elf
            software/firmware/build/esp32p4-pre3/Trimix_analyzer.map
            software/firmware/build/esp32p4-pre3/flasher_args.json
            software/firmware/build/esp32p4-v3/Trimix_analyzer.bin
            software/firmware/build/esp32p4-v3/Trimix_analyzer.elf
            software/firmware/build/esp32p4-v3/Trimix_analyzer.map
            software/firmware/build/esp32p4-v3/flasher_args.json
            software/firmware/Trimix_analyzer_esp32p4_pre3_factory_${{ github.sha }}.bin
            software/firmware/Trimix_analyzer_esp32p4_v3_factory_${{ github.sha }}.bin

      - name: Report build
        run: |
          echo "## ESP32-P4 Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Built native 480x800 firmware for pre-v3 and v3+ ESP32-P4 silicon." >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/esp32p4-pre3/Trimix_analyzer.bin build/esp32p4-v3/Trimix_analyzer.bin >> "$GITHUB_STEP_SUMMARY"
