name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build ESP32-P4 Firmware and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake pkg-config libsdl2-dev

      - name: Determine version bump type
        id: version-bump
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bump_type=${{ github.event.inputs.version_bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP_TYPE="patch"
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            COMMIT_MESSAGES="$(git log --pretty=format:'%s' "${{ github.event.before }}..${{ github.event.after }}" 2>/dev/null || true)"
          else
            COMMIT_MESSAGES="$(git log --pretty=format:'%s' -10)"
          fi

          if grep -qiE "BREAKING|^major:|!:" <<< "$COMMIT_MESSAGES"; then
            BUMP_TYPE="major"
          elif grep -qiE "^feat|^feature|^minor:" <<< "$COMMIT_MESSAGES"; then
            BUMP_TYPE="minor"
          fi
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          HEADER_VERSION="$(sed -nE 's/^#define TRIMIX_ANALYZER_VERSION "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' main/version.h)"
          LATEST_VERSION="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed -nE 's/^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$/\1/p' | sort -V | tail -n 1)"
          LATEST_VERSION="${LATEST_VERSION:-0.0.0}"

          # A deliberately raised header version (the P4 migration starts at
          # 0.2.0) is released as-is. Otherwise bump from the newest tag, so a
          # failed version commit can never retry an existing release tag.
          HIGHEST="$(printf '%s\n%s\n' "$HEADER_VERSION" "$LATEST_VERSION" | sort -V | tail -n 1)"
          if [ "$HIGHEST" = "$HEADER_VERSION" ] && [ "$HEADER_VERSION" != "$LATEST_VERSION" ]; then
            NEW_VERSION="$HEADER_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            case "${{ steps.version-bump.outputs.bump_type }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          if git rev-parse -q --verify "refs/tags/v${NEW_VERSION}" >/dev/null; then
            echo "Calculated release tag v${NEW_VERSION} already exists." >&2
            exit 1
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $NEW_VERSION"

      - name: Update firmware version
        run: ./scripts/set_version.sh "${{ steps.version.outputs.new_version }}"

      - name: Run host unit and static tests
        run: ./scripts/run_tests.sh

      - name: Build pre-v3 ESP32-P4 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: .
          command: >-
            idf.py -B build/esp32p4-pre3
            -D IDF_TARGET=esp32p4
            -D SDKCONFIG=build/esp32p4-pre3/sdkconfig
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32p4;sdkconfig.defaults.esp32p4.pre3"
            build

      - name: Run full simulator tests
        env:
          TRIMIX_REQUIRE_SIMULATOR: "1"
        run: ./scripts/run_tests.sh

      - name: Check pre-v3 firmware size
        env:
          BUILD_DIR: ${{ github.workspace }}/build/esp32p4-pre3
          PARTITIONS_FILE: ${{ github.workspace }}/partitions.esp32p4.pre3.csv
        run: ./scripts/check_firmware_size.sh

      - name: Build v3+ ESP32-P4 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: .
          command: >-
            idf.py -B build/esp32p4-v3
            -D IDF_TARGET=esp32p4
            -D SDKCONFIG=build/esp32p4-v3/sdkconfig
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32p4;sdkconfig.defaults.esp32p4.v3"
            build

      - name: Check v3+ firmware size
        env:
          BUILD_DIR: ${{ github.workspace }}/build/esp32p4-v3
        run: ./scripts/check_firmware_size.sh

      - name: Name OTA application images
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          cp build/esp32p4-pre3/Trimix_analyzer.bin "Trimix_analyzer_esp32p4_pre3_v${VERSION}.bin"
          cp build/esp32p4-v3/Trimix_analyzer.bin "Trimix_analyzer_esp32p4_v3_v${VERSION}.bin"

      - name: Validate OTA application identities and create digest manifest
        run: >-
          python3 scripts/verify_release.py
          --version "${{ steps.version.outputs.new_version }}"
          --asset-dir . --output release-ota-manifest.json

      - name: Create pre-v3 first-install image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: .
          command: >-
            esptool.py --chip esp32p4 merge_bin
            --flash_mode dio --flash_freq 80m --flash_size 16MB
            -o Trimix_analyzer_esp32p4_pre3_factory_v${{ steps.version.outputs.new_version }}.bin
            0x2000 build/esp32p4-pre3/bootloader/bootloader.bin
            0x20000 build/esp32p4-pre3/Trimix_analyzer.bin
            0x8000 build/esp32p4-pre3/partition_table/partition-table.bin
            0x10000 build/esp32p4-pre3/ota_data_initial.bin

      - name: Create v3+ first-install image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: .
          command: >-
            esptool.py --chip esp32p4 merge_bin
            --flash_mode dio --flash_freq 80m --flash_size 32MB
            -o Trimix_analyzer_esp32p4_v3_factory_v${{ steps.version.outputs.new_version }}.bin
            0x2000 build/esp32p4-v3/bootloader/bootloader.bin
            0x20000 build/esp32p4-v3/Trimix_analyzer.bin
            0x8000 build/esp32p4-v3/partition_table/partition-table.bin
            0x10000 build/esp32p4-v3/ota_data_initial.bin

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trimix-analyzer-esp32p4-v${{ steps.version.outputs.new_version }}
          if-no-files-found: error
          path: |
            Trimix_analyzer_esp32p4_*_v${{ steps.version.outputs.new_version }}.bin
            build/esp32p4-pre3/Trimix_analyzer.elf
            build/esp32p4-pre3/Trimix_analyzer.map
            build/esp32p4-pre3/flasher_args.json
            build/esp32p4-v3/Trimix_analyzer.elf
            build/esp32p4-v3/Trimix_analyzer.map
            build/esp32p4-v3/flasher_args.json
            release-ota-manifest.json

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ]; then
            CHANGES="$(git log "${LAST_TAG}..HEAD" --pretty=format:'- %s' --reverse)"
          else
            CHANGES="$(git log -10 --pretty=format:'- %s' --reverse)"
          fi
          {
            echo "changelog<<EOF"
            echo "## Ziphius v${{ steps.version.outputs.new_version }}"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "### Hardware"
            echo "Native 480x800 firmware for Guition JC4880P443C_I_W."
            echo "Choose the pre-v3 or v3+ factory image using \`make board-info\`."
            echo "The smaller matching image is for OTA updates. ESP32-S3 devices cannot install this release."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stage GitHub release for digest verification
        id: staged-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Ziphius v${{ steps.version.outputs.new_version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            Trimix_analyzer_esp32p4_*_v${{ steps.version.outputs.new_version }}.bin
            release-ota-manifest.json
          fail_on_unmatched_files: true
          draft: true
          prerelease: false

      - name: Verify uploaded digests and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.staged-release.outputs.id }}
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
        shell: bash
        run: |
          # A missing/mismatched server digest leaves a draft, invisible to /latest.
          VERIFIED=false
          for ATTEMPT in $(seq 1 10); do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > uploaded-release.json &&
               python3 scripts/verify_release.py --version "$RELEASE_VERSION" --asset-dir . --release-json uploaded-release.json; then
              VERIFIED=true
              break
            fi
            sleep 3
          done
          [ "$VERIFIED" = true ] || { echo "Release remains a draft: OTA validation failed." >&2; exit 1; }
          gh release edit "v${RELEASE_VERSION}" --draft=false

      - name: Commit version update
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add main/version.h
          git diff --staged --quiet || git commit -m "chore: release v${{ steps.version.outputs.new_version }} [skip ci]"
          git push

      - name: Summary
        run: |
          echo "## Released v${{ steps.version.outputs.new_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Native ESP32-P4 portrait builds were produced for pre-v3 and v3+ silicon." >> "$GITHUB_STEP_SUMMARY"
