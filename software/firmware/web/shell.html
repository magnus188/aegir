<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Interactive browser demo of the Ægir trimix analyzer interface.">
  <title>Ægir — Interactive Demo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050b14;
      color: #f7fafc;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% -10%, rgba(20, 184, 166, 0.18), transparent 42rem),
        linear-gradient(180deg, #081321 0%, #050b14 68%);
    }

    .page {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    header {
      width: min(100%, 760px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(16px, 3.4vw, 20px);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: #8fa3b8;
      font-size: 12px;
    }

    .badge {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid rgba(94, 234, 212, 0.24);
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.14);
      color: #99f6e4;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    main {
      min-height: 0;
      display: grid;
      place-items: center;
    }

    .device {
      position: relative;
      width: min(480px, calc(100vw - 36px), calc((100dvh - 170px) * 0.6));
      aspect-ratio: 3 / 5;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.23);
      border-radius: clamp(18px, 4vw, 28px);
      background: #05080d;
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.46),
        0 0 0 7px rgba(15, 23, 42, 0.7),
        0 0 0 8px rgba(148, 163, 184, 0.12);
      isolation: isolate;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      border: 0;
      outline: none;
      background: #05080d;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 16px;
      padding: 28px;
      background: #07111f;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .loading[hidden] {
      display: grid;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(94, 234, 212, 0.18);
      border-top-color: #2dd4bf;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    #status {
      margin: 0;
      color: #b8c5d3;
      font-size: 13px;
      text-align: center;
    }

    .error .spinner { display: none; }
    .error #status { color: #fca5a5; }

    footer {
      width: min(100%, 760px);
      margin: 0 auto;
      color: #718398;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-height: 720px) {
      .page { gap: 10px; padding-top: 12px; padding-bottom: 12px; }
      .subtitle, footer { display: none; }
      .device { width: min(480px, calc(100vw - 36px), calc((100dvh - 78px) * 0.6)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 1.6s; }
      .loading { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <div>
          <h1>Ægir</h1>
          <p class="subtitle">Trimix analyzer interface preview</p>
        </div>
      </div>
      <div class="badge">Web demo</div>
    </header>

    <main>
      <div class="device">
        <div class="loading" id="loading" role="status" aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <p id="status">Loading analyzer…</p>
        </div>
        <canvas id="canvas" tabindex="0" aria-label="Interactive Ægir simulator" oncontextmenu="event.preventDefault()"></canvas>
      </div>
    </main>

    <footer>
      Tap or click the display to interact. Sensor readings, Wi-Fi, battery, and software updates are simulated for demonstration purposes.
    </footer>
  </div>

  <script>
    const loadingElement = document.getElementById('loading');
    const statusElement = document.getElementById('status');
    const canvasElement = document.getElementById('canvas');

    var Module = {
      canvas: canvasElement,
      preRun: [],
      postRun: [function () {
        loadingElement.hidden = true;
        canvasElement.focus({ preventScroll: true });
      }],
      print: function (text) { console.log(text); },
      printErr: function (text) {
        if (text.startsWith('[I]')) {
          console.log(text);
        } else if (text.startsWith('[W]')) {
          console.warn(text);
        } else {
          console.error(text);
        }
      },
      setStatus: function (text) {
        if (!text) return;
        statusElement.textContent = text.replace(/\((\d+)\/(\d+)\)/, function (_, current, total) {
          return Math.round((Number(current) / Number(total)) * 100) + '%';
        });
      },
      onAbort: function (reason) {
        loadingElement.classList.add('error');
        loadingElement.hidden = false;
        statusElement.textContent = 'The demo could not start. Please reload the page.';
        console.error(reason);
      }
    };

    window.addEventListener('error', function () {
      if (!loadingElement.hidden) {
        loadingElement.classList.add('error');
        statusElement.textContent = 'The demo could not start. Please reload the page.';
      }
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
